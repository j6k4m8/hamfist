name: Android
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: ./gradlew :core:test :phone:assembleDebug :wear:assembleDebug :phone:lintDebug :wear:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hamfist-debug-apks
          if-no-files-found: error
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
