name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py version "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :core:test :phone:assembleRelease :wear:assembleRelease :phone:lintRelease :wear:lintRelease \
            -PhamfistVersionName="$VERSION_NAME" -PhamfistVersionCode="$VERSION_CODE" --console=plain
      - name: Sign and verify both APKs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HAMFIST_KEYSTORE_BASE64: ${{ secrets.HAMFIST_KEYSTORE_BASE64 }}
          HAMFIST_KEYSTORE_PASSWORD: ${{ secrets.HAMFIST_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/hamfist-release.p12"
          trap 'rm -f "$keystore"' EXIT
          test -n "$HAMFIST_KEYSTORE_BASE64" || { echo 'Missing HAMFIST_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$HAMFIST_KEYSTORE_PASSWORD" || { echo 'Missing HAMFIST_KEYSTORE_PASSWORD secret'; exit 1; }
          printf '%s' "$HAMFIST_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          python3 scripts/release.py package "$RELEASE_TAG" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apks
          path: dist
      - name: Create release and attach APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            if [ "$(cat release-state)" != true ]; then
              echo 'This release is already published; publish fixes with a new version tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Hamfist $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.apk SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
